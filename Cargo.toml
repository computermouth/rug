[package]
name = "rug"
version = "0.1.0"
edition = "2021"

[dependencies]
relm4 = "0.11"
# Same crate relm4 re-exports; listed to enable gtk 4.10 APIs (FileDialog).
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
webkit6 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
