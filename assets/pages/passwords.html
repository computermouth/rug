<!DOCTYPE html>
<html lang="en" data-theme="{{theme}}">
<head>
<meta charset="UTF-8">
<title>passwords</title>
<link rel="stylesheet" href="rug://assets/rug.css">
<script src="rug://assets/favicons.js"></script>
</head>
<body>
<a class="corner left" href="rug://settings">⚙️ Settings</a>
<a class="corner right" href="rug://home">🏠 Home</a>
<h1>passwords</h1>
<p class="note passwords-note">Encrypted to {{key}} in {{dir}}</p>
<ul class="list passwords">{{rows}}</ul>
<form class="add-login" method="post" action="rug://passwords" autocomplete="off">
  <h2>Add a Login</h2>
  <div class="fields">
    <input type="text" name="site" value="{{site}}" placeholder="Site, e.g. itch.io" required>
    <input type="text" name="username" value="{{username}}" placeholder="Username">
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="primary">Add</button>
  </div>
  <p class="error">{{error}}</p>
</form>
<script>
  document.addEventListener('click', function (e) {
    var link = e.target.closest('[data-confirm]');
    if (link && !confirm(link.dataset.confirm)) e.preventDefault();
  });
</script>
</body>
</html>
